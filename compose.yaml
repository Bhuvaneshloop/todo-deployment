services:
  postgres:
     image: postgres:17
     container_name: postgres
     restart: unless-stopped
     ports:
       - "5432:5432"
     env_file:
       - .env
     environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
     volumes:
       -  postgres-db:/var/lib/postgres/data
       - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
     networks:
       - todo-network
  todo-app:
     image: bhuvanesh2003/todo-app:latest
     container_name: todo-app
     restart: unless-stopped
     ports:
      - "8080:8080"
     env_file:
       - .env
     environment:
       DB_URL: ${DB_URL}
       DB_USERNAME: ${DB_USERNAME}
       DB_PASSWORD: ${DB_PASSWORD}
     networks:
       - todo-network
  todo-ui:
     image: bhuvanesh2003/todo-ui:latest
     container_name: todo-ui
     restart: unless-stopped
     ports:
       - "80:80"
     networks:
       - todo-network
volumes:
    postgres-db:
networks:
    todo-network:
       driver: bridge
