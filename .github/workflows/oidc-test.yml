name: Deploy Todo Application

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout deployment repository
      - name: Checkout deployment repository
        uses: actions/checkout@v4

      # 2. Authenticate GitHub Actions with AWS using OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::109684670986:role/GitHubActionsSSM
          aws-region: ap-south-1

      # 3. Verify which AWS identity is being used
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # 4. Send deployment command to EC2 through SSM
      - name: Deploy on EC2
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0ef3723e1f90886fd \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /home/ubuntu/todo-deployment",
              "./start.sh"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Wait for the command to complete
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-0ef3723e1f90886fd

      # 5. Get deployment output
      - name: Get deployment result
        run: |
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0ef3723e1f90886fd
