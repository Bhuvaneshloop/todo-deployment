name: Deploy Todo Application

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout deployment repository
        uses: actions/checkout@v4

      # 2. GitHub OIDC -> AWS STS -> IAM Role
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::109684670986:role/GitHubActionsSSM
          aws-region: ap-south-1

      # 3. Verify assumed role
      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      # 4. Send deployment command to EC2 through SSM
      - name: Deploy on EC2 through SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0ef3723e1f90886fd \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /home/ubuntu/todo-deployment",
              "bash start.sh"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

          echo "SSM Command ID: $COMMAND_ID"

      # 5. Wait for SSM command
      # Continue even when the command fails so we can get the real error
      - name: Wait for deployment
        continue-on-error: true
        run: |
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-0ef3723e1f90886fd

      # 6. Always retrieve the actual EC2 execution result
      - name: Get SSM execution result
        if: always()
        run: |
          echo "===== SSM EXECUTION RESULT ====="

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0ef3723e1f90886fd \
            --query '{
              Status: Status,
              StatusDetails: StatusDetails,
              Output: StandardOutputContent,
              Error: StandardErrorContent
            }' \
            --output json

      # 7. Determine whether deployment succeeded
      - name: Check deployment status
        if: always()
        run: |
          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0ef3723e1f90886fd \
            --query 'Status' \
            --output text)

          echo "Final deployment status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed."
            exit 1
          fi

          echo "Deployment successful."
