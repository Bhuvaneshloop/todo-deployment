name: Deploy Todo Application

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout deployment repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::109684670986:role/GitHubActionsSSM
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Send deployment command
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0ef3723e1f90886fd \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /home/ubuntu/todo-deployment",
              "bash start.sh"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

          echo "SSM Command ID: $COMMAND_ID"

      - name: Wait for SSM command
        continue-on-error: true
        run: |
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-0ef3723e1f90886fd

      - name: Show SSM result
        if: always()
        run: |
          echo "================================"
          echo "SSM COMMAND RESULT"
          echo "================================"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0ef3723e1f90886fd \
            --query '{
              Status: Status,
              StatusDetails: StatusDetails,
              StandardOutput: StandardOutputContent,
              StandardError: StandardErrorContent
            }' \
            --output json
