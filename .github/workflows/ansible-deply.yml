
name: Deploy Todo App using Ansible SSH

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/todo-ec2.pem
          chmod 600 ~/.ssh/todo-ec2.pem

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible and collections
        run: |
          python -m pip install --upgrade pip
          python -m pip install ansible
          ansible-galaxy collection install community.docker

      - name: Create SSH inventory
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        working-directory: ansible-roles
        run: |
          cat > inventory-ssh <<EOF
          [todo_servers]
          todo ansible_host=${EC2_HOST} ansible_user=${EC2_USER} ansible_ssh_private_key_file=$HOME/.ssh/todo-ec2.pem ansible_python_interpreter=/usr/bin/python3 ansible_ssh_common_args='-o StrictHostKeyChecking=accept-new -o ConnectTimeout=15'
          EOF

          cat inventory-ssh

      - name: Test SSH connectivity
        working-directory: ansible-roles
        run: |
          ansible todo_servers \
            -i inventory-ssh \
            -m ansible.builtin.ping \
            -vvvv

      - name: Deploy Todo App
        working-directory: ansible-roles
        run: |
          ansible-playbook \
            -i inventory-ssh \
            site.yml \
            --become \
            -vvvv
