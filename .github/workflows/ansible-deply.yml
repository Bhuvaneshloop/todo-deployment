```yaml
name: Deploy Todo Application with Ansible

on:
  workflow_dispatch:
    inputs:
      BACKEND_TAG:
        description: "Backend image tag"
        required: true
        default: latest

      UI_TAG:
        description: "UI image tag"
        required: true
        default: latest

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Checkout deployment repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configure AWS credentials using GitHub OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::109684670986:role/GitHubActionsSSM
          aws-region: ap-south-1

      # 3. Install Ansible and AWS dependencies
      - name: Install Ansible and dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade ansible boto3 botocore
          echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      # 4. Install AWS Session Manager plugin
      - name: Install Session Manager plugin
        run: |
          curl -fsSL \
            https://s3.amazonaws.com/session-manager-downloads/plugin/latest/ubuntu_64bit/session-manager-plugin.deb \
            -o /tmp/session-manager-plugin.deb

          sudo dpkg -i /tmp/session-manager-plugin.deb
          session-manager-plugin --version

      # 5. Install a pinned AWS collection and Docker collection
      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install amazon.aws:10.1.2 community.docker

      # 6. Verify AWS identity and EC2 SSM status
      - name: Verify AWS and EC2 SSM status
        env:
          AWS_PAGER: ""
        run: |
          aws sts get-caller-identity

          aws ssm describe-instance-information \
            --region ap-south-1 \
            --filters "Key=InstanceIds,Values=i-0ef3723e1f90886fd" \
            --query "InstanceInformationList[].{InstanceId:InstanceId,PingStatus:PingStatus}" \
            --output table

      # 7. Verify runner-side versions
      - name: Check Ansible and AWS SDK versions
        run: |
          python -m pip show ansible-core boto3 botocore
          ansible-galaxy collection list amazon.aws
          ansible-doc -t connection amazon.aws.aws_ssm | head -40

      # 8. Configure Ansible SSM inventory
      - name: Configure SSM inventory
        working-directory: ansible-roles
        env:
          SSM_BUCKET: todo-ansible-ssm-109684670986
        run: |
          cat > inventory-ssm <<EOF
          [todo_servers]
          todo ansible_connection=amazon.aws.aws_ssm ansible_aws_ssm_instance_id=i-0ef3723e1f90886fd ansible_aws_ssm_region=ap-south-1 ansible_aws_ssm_bucket_name=${SSM_BUCKET} ansible_aws_ssm_timeout=600 ansible_python_interpreter=/usr/bin/python3
          EOF

      # 9. Test basic command execution first
      - name: Diagnose Ansible SSM connection
        working-directory: ansible-roles
        timeout-minutes: 3
        run: |
          ansible todo_servers \
            -i inventory-ssm \
            -m ansible.builtin.command \
            -a "id" \
            -vvvv

      # 10. Test the apt module separately
      - name: Diagnose Ansible apt module
        working-directory: ansible-roles
        timeout-minutes: 5
        run: |
          ansible todo_servers \
            -i inventory-ssm \
            --become \
            -m ansible.builtin.apt \
            -a "update_cache=false" \
            -vvvv

      # 11. Deploy Todo application only if diagnostics pass
      - name: Deploy Todo application
        working-directory: ansible-roles
        env:
          BACKEND_TAG: ${{ inputs.BACKEND_TAG }}
          UI_TAG: ${{ inputs.UI_TAG }}
          ANSIBLE_LOG_PATH: ${{ runner.temp }}/ansible-deploy.log
        timeout-minutes: 12
        run: |
          set -o pipefail

          ansible-playbook \
            -i inventory-ssm \
            site.yml \
            -e "BACKEND_TAG=$BACKEND_TAG UI_TAG=$UI_TAG" \
            -vvvv 2>&1 | tee "$ANSIBLE_LOG_PATH"

      # 12. Upload deployment log
      - name: Upload Ansible debug log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ansible-debug-log
          path: ${{ runner.temp }}/ansible-deploy.log
          if-no-files-found: warn
          retention-days: 3
```
