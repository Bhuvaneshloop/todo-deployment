name: OIDC Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check OIDC environment
        run: |
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Ref: $GITHUB_REF"
          echo "Branch: $GITHUB_REF_NAME"
          echo "OIDC URL exists: ${ACTIONS_ID_TOKEN_REQUEST_URL:+YES}"
          echo "OIDC token permission is enabled"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::109684670986:role/Actions-role
          aws-region: ap-south-1

      - name: Check AWS identity
        run: |
          aws sts get-caller-identity
