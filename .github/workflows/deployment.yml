name: Deploy Todo Application

on:
  workflow_dispatch:
    inputs:
      BACKEND_TAG:
        description: 'ENTER THE BACKEND TAG'
        required: true
        default: latest
        type: string

      UI_TAG:
        description: 'ENTER THE UI TAG'
        required: true
        default: latest
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::109684670986:role/GitHubActionsSSM
          aws-region: ap-south-1

      - name: Verify AWS identity
        run: |
          aws sts get-caller-identity

      - name: Deploy application through SSM
        run: |

          echo "======================================"
          echo "Starting Todo Application Deployment"
          echo "======================================"

          echo "Backend tag: ${{ inputs.BACKEND_TAG }}"
          echo "UI tag: ${{ inputs.UI_TAG }}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids i-0ef3723e1f90886fd \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "echo \"SSM execution started\"",
              "whoami",
              "pwd",
              "curl --version",
              "git --version",
              "curl -fsSL -o /home/ubuntu/start.sh https://raw.githubusercontent.com/Bhuvaneshloop/todo-deployment/main/start.sh",
              "ls -l /home/ubuntu/start.sh",
              "chmod +x /home/ubuntu/start.sh",
              "BACKEND_TAG=${{ inputs.BACKEND_TAG }} UI_TAG=${{ inputs.UI_TAG }} bash /home/ubuntu/start.sh"
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "COMMAND_ID=$COMMAND_ID" >> "$GITHUB_ENV"

      - name: Wait for deployment
        continue-on-error: true
        run: |

          echo "Waiting for SSM command..."

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id i-0ef3723e1f90886fd

      - name: Get deployment result
        if: always()
        run: |

          echo "======================================"
          echo "SSM EXECUTION RESULT"
          echo "======================================"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0ef3723e1f90886fd \
            --query '{
              Status: Status,
              StatusDetails: StatusDetails,
              Output: StandardOutputContent,
              Error: StandardErrorContent
            }' \
            --output json

      - name: Check deployment status
        if: always()
        run: |

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id i-0ef3723e1f90886fd \
            --query 'Status' \
            --output text)

          echo "Deployment status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed."
            exit 1
          fi

          echo "Deployment successful."
