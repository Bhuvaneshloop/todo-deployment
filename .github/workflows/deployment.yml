name: Deploy Todo Application

on:
  workflow_dispatch:
    inputs:
      BACKEND_TAG:
        description: "Backend image tag"
        required: true
        default: latest

      UI_TAG:
        description: "UI image tag"
        required: true
        default: latest

jobs:

  deploy:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:

      # 1. GitHub gets temporary AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::109684670986:role/GitHubActionsSSM
          aws-region: ap-south-1

      # 2. Tell AWS SSM to run commands on EC2
      - name: Deploy
        run: |
          aws ssm send-command \
            --instance-ids i-0ef3723e1f90886fd \
            --document-name AWS-RunShellScript \
            --parameters 'commands=[
              "curl -fsSL -o /home/ubuntu/start.sh https://raw.githubusercontent.com/Bhuvaneshloop/todo-deployment/main/start.sh",
              "chmod +x /home/ubuntu/start.sh",
              "BACKEND_TAG=${{ inputs.BACKEND_TAG }} UI_TAG=${{ inputs.UI_TAG }} bash /home/ubuntu/start.sh"
            ]'
