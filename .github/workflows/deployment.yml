name: Deploy Todo Application

on:
  workflow_dispatch:
    inputs:
      BACKEND_TAG:
        description: 'ENTER THE BACKEND TAG'
        required: true
        default: latest
        type: string
      UI_TAG:
        description: 'ENTER THE UI TAG'
        required: true
        default: latest
        type: string

        

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: checking out the proejct 
        uses: actions/checkout@v4
        
      - name: Check deployment files
        run: |
             pwd
             ls -la
             test -f start.sh
      # 1. Copy bootstrap script from GitHub to EC2
      - name: Copy bootstrap script to EC2
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "start.sh"
          target: "/home/ubuntu/"
          
      - name: Deploy application on EC2
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            echo "======================================"
            echo "Starting Todo Application Deployment"
            echo "======================================"

            sed -i "s+BACKEND_TAG=latest+BACKEND_TAG=${{ inputs.BACKEND_TAG }}+g" /home/ubuntu/todo-deployment/.env
            sed -i "s+UI_TAG=latest+UI_TAG=${{ inputs.UI_TAG }}+g" /home/ubuntu/todo-deployment/.env

            echo "${{ inputs.BACKEND_TAG }}"
            echo "${{ inputs.UI_TAG }}"

            echo "Making bootstrap script executable..."
            chmod +x /home/ubuntu/start.sh

            echo "Running bootstrap script..."
            /home/ubuntu/start.sh

            echo "Checking deployment repository..."
